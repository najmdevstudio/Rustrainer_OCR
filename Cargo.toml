[package]
name = "plate-ocr"
version = "0.1.0"
edition = "2024"
description = "Pure-Rust CRNN (CNN + BiLSTM + CTC) OCR training/inference utility for license plates, with a GUI wizard and ONNX export."
license = "MIT"
readme = "README.md"
# TODO: point this at the real GitHub repository once the project is pushed there (also update
# the same placeholder in install.sh and README.md).
repository = "https://github.com/OWNER/REPO"

[features]
default = ["rocm"]
rocm = ["burn/rocm", "burn/fusion"]
cpu = ["burn/ndarray"]
vulkan = ["burn/vulkan", "burn/fusion"]

# Used for the binaries downloaded from GitHub Releases / installed via install.sh: `thin` LTO +
# a single codegen unit produce a smaller, faster single-file executable at the cost of a longer
# build. `panic` is deliberately left at its default ("unwind"): the GUI's background training
# worker (src/gui/worker.rs) relies on `catch_unwind` to turn a training panic into a graceful
# failure screen instead of taking down the whole app.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dependencies]
burn = { version = "0.21", features = ["train", "autodiff"] }
burn-store = "0.21"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
csv = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
log = "0.4"
env_logger = "0.11"
# GUI wizard (native window via the OS's own window manager)
eframe = "0.33.3"
egui = "0.33.3"
egui_plot = "0.34"
rfd = "0.15"
